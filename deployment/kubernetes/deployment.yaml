apiVersion: apps/v1
kind: Deployment
metadata:
  name: sg-io-app
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sg-io
  template:
    metadata:
      labels:
        app: sg-io
        version: 1.0.0
    spec:
      containers:
      - name: sg-app
        image: your-registry/sg-io:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sg-io-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sg-io-secrets
              key: jwt-secret
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: sg-io-secrets
              key: stripe-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sg-io-service
spec:
  selector:
    app: sg-io
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer